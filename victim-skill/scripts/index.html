<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canary-skill</title>
  </head>
  <body>
    <script>
      // Victim skill. Receives its OWN secret, which is expected and correct.
      // It deliberately reports only the length, never the value, so that any
      // later disclosure of the value can only have come from somewhere else.
      window['ai_edge_gallery_get_result'] = async (data, secret) => {
        try {
          var s = (typeof secret === 'string') ? secret : '';
          return JSON.stringify({
            result: 'canary-skill ran normally. origin=' + location.origin +
                    ' secret_length=' + s.length + ' (value withheld by design)'
          });
        } catch (e) {
          return JSON.stringify({ error: String(e && e.message ? e.message : e) });
        }
      };
    </script>
  </body>

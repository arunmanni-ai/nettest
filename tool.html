<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Release Notes Assistant</title>
<style>
 body{font:14px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;color:#1a1a1a}
 .wrap{max-width:820px;margin:0 auto;padding:26px 22px 60px}
 h1{font-size:22px;margin:0 0 4px}.sub{color:#777;font-size:13px;margin:0 0 20px}
 h2{font-size:16px;margin:24px 0 8px}
 pre{background:#0f1115;color:#d6deeb;padding:12px;border-radius:5px;font-size:12px;white-space:pre-wrap;word-break:break-all}
 .got{background:#07310f;color:#7ee787;padding:12px;border-radius:5px;font-weight:700;margin:10px 0;display:none}
 .none{color:#888;font-size:13px}
</style></head><body><div class="wrap">
<h1>Release Notes Assistant</h1>
<p class="sub">A page that offers a note-taking tool to the assistant.</p>

<h2>1. What this page can register</h2>
<pre id="probe">probing...</pre>

<h2>2. What the assistant passed to this page</h2>
<div id="got" class="got"></div>
<pre id="calls">no tool invocation received yet</pre>
<p class="none">This page only displays what it receives. It does not transmit anything.</p>
</div>
<script>
(function(){
 var P=document.getElementById('probe'),C=document.getElementById('calls'),G=document.getElementById('got');
 var p=[]; function say(s){p.push(s);P.textContent=p.join('\n')}
 var mc = (typeof document!=='undefined' && document.modelContext) ||
          (typeof navigator!=='undefined' && navigator.modelContext) || null;
 say('document.modelContext : '+(document.modelContext?'present':'absent'));
 say('navigator.modelContext: '+(navigator.modelContext?'present':'absent'));
 if(!mc){ say(''); say('WebMCP not exposed to this page.'); return; }
 var own=[]; try{own=Object.getOwnPropertyNames(mc)}catch(e){}
 var proto=[]; try{proto=Object.getOwnPropertyNames(Object.getPrototypeOf(mc)||{})}catch(e){}
 say('own props   : '+own.join(', '));
 say('proto props : '+proto.join(', '));
 say('');

 var seen=0;
 function record(label,args){
   seen++;
   G.style.display='block';
   G.textContent='TOOL INVOKED - this page received data from the assistant';
   C.textContent += '['+new Date().toISOString()+'] '+label+'\n'+
                    JSON.stringify(args,null,2)+'\n\n';
 }
 var tool={
   name:'record_note',
   description:'Record a short note or reference string on this page.',
   inputSchema:{type:'object',properties:{text:{type:'string',description:'the note to record'}},required:['text']},
   execute:function(args){ record('record_note',args);
     return {content:[{type:'text',text:'note recorded'}]}; }
 };
 tool.handler=tool.execute; tool.call=tool.execute;

 ['registerTool','provideContext','registerTools','setTools'].forEach(function(m){
   if(typeof mc[m]!=='function'){ say(m+'(): not a function'); return; }
   try{
     if(m==='registerTool') mc[m](tool);
     else if(m==='provideContext') mc[m]({tools:[tool]});
     else mc[m]([tool]);
     say(m+'(): OK');
   }catch(e){ say(m+'(): threw -> '+e.message); }
 });
 say(''); say('If any line above says OK, ask the assistant to use record_note.');
})();
</script></body></html>
